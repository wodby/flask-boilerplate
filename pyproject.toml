[project]
name = "flask-boilerplate"
version = "0.1.0"
description = "Minimal Flask application for Wodby"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["."]
